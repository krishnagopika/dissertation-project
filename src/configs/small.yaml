# small.yaml — Voxtral-Small-24B + XLM-RoBERTa-base
# Requires 2x L40S (96 GB total). Submit with gpu:2.
#
# Architecture notes (from config.json):
#   audio_tower (Whisper encoder): hidden_size=1280, intermediate=5120, layers=32
#   MLP projector: 1280 → 5120 (linear + GELU + linear)
#   LLM: hidden_size=5120 (larger than Mini's 3072)
#
# acoustic_dim = 1280: extracted from Whisper encoder BEFORE projector,
# same as Mini — the projector only aligns to the LLM space, not useful for emotion.
# Embeddings are identical to Mini's (same Whisper weights), so shared path is fine.

model:
  voxtral_id: "mistralai/Voxtral-Small-24B-2507"
  xlmr_id: "FacebookAI/xlm-roberta-base"
  acoustic_dim: 1280        # Whisper encoder hidden dim — same as Mini, before MLP projector
  text_dim: 768             # XLM-RoBERTa-base hidden dim
  tensor_parallel_size: 2   # 24B model needs 2x L40S (48GB bfloat16)
  fusion_hidden: 512
  num_classes: 7
  num_sentiment_classes: 3
  dropout: 0.3

training:
  phase1_lr: 0.00002
  phase2_lr: 0.0001
  phase3_lr: 0.00001        # optional light unfreezing of XLM-R last 2 layers
  batch_size: 16            # Phase 1 trains XLM-R only, no Voxtral loaded — use full batch
  epochs_phase1: 10         # XLM-R fine-tune length (independent of Voxtral size)
  epochs_phase2: 10
  epochs_phase3: 3
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_dir: "/dcs/large/u5734759/checkpoints/small"
  log_dir: "logs/small"
  unfreeze_last_n_layers: 2  # for phase 3
  use_focal_loss: false
  focal_gamma: 2.0
  use_weighted_sampler: false
  use_paraphrases: false

data:
  meld_root: "/dcs/large/u5734759/data/meld_raw"
  transcripts_path: "/dcs/large/u5734759/data/meld_transcripts_small"
  embeddings_path: "/dcs/large/u5734759/data/meld_embeddings"
  # Text [CLS] cache is per-XLM-R-checkpoint. Keep small's cache separate from
  # mini's so switching between them doesn't require re-extraction each time.
  text_embeddings_path: "/dcs/large/u5734759/data/meld_text_embeddings_small"
  max_audio_duration: 40
  max_text_length: 128
  num_workers: 4
  seed: 42

evaluation:
  primary_metric: "weighted_f1"
  output_dir: "results/small"
